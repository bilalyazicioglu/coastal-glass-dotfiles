general {
 hide_cursor = true
 ignore_empty_input = true
}
background {
 path = __HOME__/.local/share/backgrounds/coastal-glass/coastal-drive-main.png
 color = rgba(111c2aff)
 monitor =
 blur_passes = 2
 blur_size = 4
}
input-field {
 monitor =
 size = 300, 54
 outline_thickness = 2
 outer_color = rgba(70d8e8cc)
 inner_color = rgba(111c2aee)
 font_color = rgba(dce9f2ff)
 placeholder_text = Parola
 rounding = 13
 position = 0, -70
 halign = center
 valign = center
}
label {
 monitor =
 text = cmd[update:1000] date +%H:%M
 color = rgba(dce9f2ff)
 font_size = 64
 font_family = JetBrainsMono Nerd Font
 position = 0, 80
 halign = center
 valign = center
}
